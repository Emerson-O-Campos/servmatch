<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ServMatch - Área do Prestador</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .stat-card {
            background: var(--gray-50);
            border-radius: var(--radius-lg);
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-600);
        }
        .stat-label {
            font-size: 0.75rem;
            color: var(--gray-500);
        }
        .pedido-card {
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 1rem;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }
        .pedido-card:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-200);
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .status-badge:hover {
            transform: scale(1.05);
        }
        .status-pendente { background: #fef3c7; color: #92400e; }
        .status-aceito { background: #d1fae5; color: #065f46; }
        .status-recusado { background: #fee2e2; color: #991b1b; }
        .status-concluido { background: #dbeafe; color: #1e40af; }
        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--gray-500);
        }
        .loading::before {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid var(--gray-200);
            border-top-color: var(--primary-500);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .foto-prestador-pequena {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 0.5rem;
            display: block;
            border: 3px solid white;
            box-shadow: var(--shadow-sm);
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        
        /* Dashboard Stats */
        .dashboard-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card-dashboard {
            background: var(--gradient-blue);
            border-radius: var(--radius-lg);
            padding: 1rem;
            text-align: center;
            transition: all 0.3s ease;
            color: white;
        }
        .stat-card-dashboard:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }
        .stat-value-dashboard {
            font-size: 1.75rem;
            font-weight: 700;
        }
        .stat-label-dashboard {
            font-size: 0.75rem;
            opacity: 0.9;
            margin-top: 0.25rem;
        }
        
        /* ============================================
           GRÁFICOS RESPONSIVOS
        ============================================ */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .chart-container {
            background: white;
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s ease;
            width: 100%;
            overflow-x: auto;
        }
        .chart-container:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        .chart-container canvas {
            max-width: 100%;
            height: auto !important;
            min-height: 280px;
        }
        
        /* Tooltips */
        [data-tooltip] {
            position: relative;
            cursor: help;
        }
        [data-tooltip]:before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-800);
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 1000;
        }
        [data-tooltip]:hover:before {
            opacity: 1;
        }
        
        /* Pulse animation */
        @keyframes pulse-green {
            0%, 100% { background-color: #10b981; opacity: 1; }
            50% { background-color: #34d399; opacity: 0.8; }
        }
        .pedido-novo {
            animation: pulse-green 1s ease-in-out 3;
        }
        
        .btn:active {
            transform: scale(0.96);
        }
        
        /* Responsivo */
        @media (max-width: 768px) {
            .dashboard-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.75rem;
            }
            .charts-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .chart-container {
                padding: 1rem;
            }
            .chart-container canvas {
                min-height: 240px;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 480px) {
            .dashboard-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.5rem;
            }
            .stat-card-dashboard {
                padding: 0.75rem;
            }
            .stat-value-dashboard {
                font-size: 1.25rem;
            }
            .stat-label-dashboard {
                font-size: 0.65rem;
            }
            .chart-container {
                padding: 0.75rem;
            }
            .chart-container canvas {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Premium -->
        <div class="header-premium animate-fade-in">
            <div class="flex-between">
                <div>
                    <h1 style="font-size: 1.5rem; margin-bottom: 0.25rem;">👨‍🔧 ServMatch</h1>
                    <p style="opacity: 0.9; font-size: 0.875rem;">Sua área de trabalho</p>
                </div>
                <button id="logoutBtn" class="btn-danger" style="background: rgba(255,255,255,0.2); border: none; border-radius: var(--radius-lg); padding: 0.5rem 1rem; cursor: pointer;">
                    Sair
                </button>
            </div>
        </div>
        
        <!-- Perfil -->
        <div class="card animate-slide-left delay-100">
            <div class="text-center">
                <div id="fotoContainer"></div>
                <h2 id="nomePrestador" style="font-size: 1.5rem; font-weight: 700;"></h2>
                <div class="badge badge-primary" style="display: inline-block; margin-top: 0.25rem;">
                    <span id="profissaoPrestador"></span>
                </div>
            </div>
        </div>
        
        <!-- Estatísticas Rápidas -->
        <div class="card animate-fade-in delay-200">
            <h3 class="text-gradient" style="margin-bottom: 1rem;">📊 Suas Estatísticas</h3>
            <div class="grid-2">
                <div class="stat-card" data-tooltip="Média das suas avaliações">
                    <div class="stat-value" id="avaliacao">0</div>
                    <div class="stat-label">⭐ Avaliação média</div>
                </div>
                <div class="stat-card" data-tooltip="Total de clientes que te avaliaram">
                    <div class="stat-value" id="totalAvaliacoes">0</div>
                    <div class="stat-label">📝 Total de avaliações</div>
                </div>
                <div class="stat-card" data-tooltip="Quando você entrou na plataforma">
                    <div class="stat-value" id="dataCadastro">-</div>
                    <div class="stat-label">📅 Data de cadastro</div>
                </div>
                <div class="stat-card" data-tooltip="Seu valor por hora de trabalho">
                    <div class="stat-value" id="precoHora">-</div>
                    <div class="stat-label">💰 Preço por hora</div>
                </div>
            </div>
        </div>
        
        <!-- Dashboard com Gráficos -->
        <div class="card animate-fade-in delay-250">
            <h3 class="text-gradient" style="margin-bottom: 1rem;">📈 Dashboard de Performance</h3>
            
            <div class="dashboard-stats">
                <div class="stat-card-dashboard">
                    <div class="stat-value-dashboard" id="dashboardTotalPedidos">0</div>
                    <div class="stat-label-dashboard">📋 Total Pedidos</div>
                </div>
                <div class="stat-card-dashboard">
                    <div class="stat-value-dashboard" id="dashboardPendentes">0</div>
                    <div class="stat-label-dashboard">⏳ Pendentes</div>
                </div>
                <div class="stat-card-dashboard">
                    <div class="stat-value-dashboard" id="dashboardReceita">R$ 0</div>
                    <div class="stat-label-dashboard">💰 Receita Total</div>
                </div>
                <div class="stat-card-dashboard">
                    <div class="stat-value-dashboard" id="dashboardAvaliacao">0 ⭐</div>
                    <div class="stat-label-dashboard">⭐ Avaliação Média</div>
                </div>
            </div>
            
            <div class="charts-grid">
                <div class="chart-container">
                    <canvas id="graficoStatus"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="graficoReceita"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Serviços -->
        <div class="card animate-fade-in delay-300">
            <h3 class="text-gradient" style="margin-bottom: 1rem;">💼 Seus Serviços</h3>
            <div class="input-group">
                <label class="input-label">📞 WhatsApp</label>
                <p class="text-lg" style="font-weight: 500;" id="telefonePrestador"></p>
            </div>
            <div class="input-group">
                <label class="input-label">📝 Descrição</label>
                <div style="background: var(--gray-50); padding: 1rem; border-radius: var(--radius-lg);">
                    <p id="descricaoPrestador"></p>
                </div>
            </div>
            <button id="editarPerfilBtn" class="btn btn-primary" style="margin-top: 1rem; cursor: pointer;">
                ✏️ Editar Perfil
            </button>
        </div>
        
        <!-- Pedidos Recebidos -->
        <div class="card animate-fade-in delay-400">
            <h3 class="text-gradient" style="margin-bottom: 1rem;">📋 Pedidos Recebidos</h3>
            <div id="pedidosLista"></div>
        </div>
    </div>

    <script type="module">
        import { fazerLogout } from './js/auth.js';
        import { db } from './js/firebase-config.js';
        import { collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
        import { protegerPagina } from './js/check-auth.js';
        import { mostrarSucesso, mostrarErro } from './js/toast.js';
        
        // Proteger página
        await protegerPagina();
        
        const userId = sessionStorage.getItem('userId');
        let prestadorId = null;
        let graficoStatus = null;
        let graficoReceita = null;
        
        async function carregarPerfilPrestador() {
            try {
                const q = query(collection(db, "prestadores"), where("userId", "==", userId));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const prestador = querySnapshot.docs[0].data();
                    prestadorId = querySnapshot.docs[0].id;
                    
                    document.getElementById('nomePrestador').textContent = prestador.nome;
                    document.getElementById('profissaoPrestador').textContent = prestador.profissao;
                    document.getElementById('avaliacao').textContent = `${prestador.avaliacao.toFixed(1)} ⭐`;
                    document.getElementById('totalAvaliacoes').textContent = prestador.totalAvaliacoes;
                    document.getElementById('precoHora').innerHTML = `R$ ${prestador.preco}`;
                    document.getElementById('telefonePrestador').textContent = prestador.telefone;
                    document.getElementById('descricaoPrestador').textContent = prestador.descricao || "Sem descrição cadastrada";
                    
                    const fotoContainer = document.getElementById('fotoContainer');
                    if (prestador.foto) {
                        fotoContainer.innerHTML = `<img src="${prestador.foto}" class="foto-prestador-pequena" alt="${prestador.nome}" onerror="this.style.display='none'; this.nextSibling.style.display='block'"><div style="display: none;">👨‍🔧</div>`;
                    } else {
                        fotoContainer.innerHTML = '<div style="font-size: 3rem;">👨‍🔧</div>';
                    }
                    
                    const data = prestador.criadoEm?.toDate();
                    if (data) {
                        document.getElementById('dataCadastro').textContent = data.toLocaleDateString('pt-BR');
                    }
                    
                    sessionStorage.setItem('prestadorDocId', prestadorId);
                    sessionStorage.setItem('prestadorDados', JSON.stringify(prestador));
                    
                    await carregarPedidos(prestadorId);
                    await carregarDashboard(prestadorId);
                } else {
                    window.location.href = 'cliente.html';
                }
            } catch (error) {
                console.error("Erro:", error);
            }
        }
        
        async function carregarPedidos(prestadorId) {
            const pedidosDiv = document.getElementById('pedidosLista');
            pedidosDiv.innerHTML = '<div class="loading">Carregando pedidos...</div>';
            
            try {
                const q = query(collection(db, "pedidos"), where("prestadorId", "==", prestadorId));
                const querySnapshot = await getDocs(q);
                const pedidos = [];
                querySnapshot.forEach((doc) => {
                    pedidos.push({ id: doc.id, ...doc.data() });
                });
                
                pedidos.sort((a, b) => {
                    const dateA = a.criadoEm?.toDate() || new Date(0);
                    const dateB = b.criadoEm?.toDate() || new Date(0);
                    return dateB - dateA;
                });
                
                if (pedidos.length === 0) {
                    pedidosDiv.innerHTML = `
                        <div class="text-center" style="padding: 2rem; color: var(--gray-500);">
                            <span style="font-size: 3rem;">📭</span>
                            <p>Nenhum pedido ainda.</p>
                            <p class="text-sm">Compartilhe seu perfil com os clientes!</p>
                        </div>`;
                    return;
                }
                
                let html = '';
                pedidos.forEach(pedido => {
                    const statusClass = `status-${pedido.status}`;
                    const isNovo = pedido.status === 'pendente' && new Date() - pedido.criadoEm?.toDate() < 86400000;
                    html += `
                        <div class="pedido-card ${isNovo ? 'pedido-novo' : ''}">
                            <div class="flex-between" style="margin-bottom: 0.75rem;">
                                <span class="status-badge ${statusClass}">${pedido.status.toUpperCase()}</span>
                                <span style="font-size: 0.7rem; color: var(--gray-500);">${pedido.criadoEm?.toDate().toLocaleDateString()}</span>
                            </div>
                            <p><strong>👤 Cliente:</strong> ${pedido.clienteNome || pedido.clienteEmail}</p>
                            <p><strong>📅 Data:</strong> ${pedido.data} às ${pedido.horario}</p>
                            <p><strong>📍 Local:</strong> ${pedido.endereco}</p>
                            <p><strong>⏱️ Duração:</strong> ${pedido.duracao}h</p>
                            <p><strong>💰 Valor:</strong> R$ ${pedido.valorEstimado?.toFixed(2)}</p>
                            <p><strong>📝 Descrição:</strong> ${pedido.descricao || '-'}</p>
                            <div class="flex-between" style="margin-top: 0.75rem; gap: 0.5rem; flex-wrap: wrap;">
                                ${pedido.status === 'pendente' ? `
                                    <button class="btn-aceitar" data-id="${pedido.id}" data-status="aceito" style="flex: 1; padding: 0.5rem; background: #10b981; color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600;">✅ Aceitar</button>
                                    <button class="btn-recusar" data-id="${pedido.id}" data-status="recusado" style="flex: 1; padding: 0.5rem; background: #ef4444; color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600;">❌ Recusar</button>
                                ` : ''}
                                ${pedido.status === 'aceito' ? `
                                    <button class="btn-concluir" data-id="${pedido.id}" data-status="concluido" style="flex: 1; padding: 0.5rem; background: #3b82f6; color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-weight: 600;">✅ Concluir</button>
                                ` : ''}
                                ${pedido.status === 'concluido' ? `
                                    <span style="flex: 1; padding: 0.5rem; background: #d1fae5; color: #065f46; border-radius: var(--radius-md); text-align: center; font-weight: 600;">✓ Serviço concluído</span>
                                ` : ''}
                                ${pedido.status === 'recusado' ? `
                                    <span style="flex: 1; padding: 0.5rem; background: #fee2e2; color: #991b1b; border-radius: var(--radius-md); text-align: center; font-weight: 600;">✗ Pedido recusado</span>
                                ` : ''}
                                <a href="https://wa.me/55${pedido.clienteTelefone || ''}?text=Olá! Recebi sua solicitação de serviço." target="_blank" style="flex: 1; padding: 0.5rem; background: #25D366; color: white; border: none; border-radius: var(--radius-md); text-align: center; text-decoration: none; font-weight: 600;">💬 WhatsApp</a>
                            </div>
                        </div>
                    `;
                });
                pedidosDiv.innerHTML = html;
                
                document.querySelectorAll('[data-status]').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const originalText = btn.innerHTML;
                        btn.innerHTML = '⏳ Processando...';
                        btn.disabled = true;
                        
                        const pedidoId = btn.dataset.id;
                        const novoStatus = btn.dataset.status;
                        await atualizarStatusPedido(pedidoId, novoStatus);
                        
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                    });
                });
            } catch (error) {
                console.error("Erro detalhado ao carregar pedidos:", error);
                pedidosDiv.innerHTML = `<p style="color: red; text-align: center;">❌ Erro ao carregar: ${error.message}</p>`;
            }
        }
        
        async function atualizarStatusPedido(pedidoId, novoStatus) {
            try {
                const pedidoRef = doc(db, "pedidos", pedidoId);
                await updateDoc(pedidoRef, { status: novoStatus });
                const mensagem = novoStatus === 'aceito' ? 'aceito' : novoStatus === 'recusado' ? 'recusado' : 'concluído';
                mostrarSucesso(`Pedido ${mensagem} com sucesso!`);
                await carregarPedidos(prestadorId);
                await carregarDashboard(prestadorId);
            } catch (error) {
                console.error("Erro ao atualizar status:", error);
                mostrarErro(error.message);
            }
        }
        
        async function carregarDashboard(prestadorId) {
            const pedidosQuery = query(collection(db, "pedidos"), where("prestadorId", "==", prestadorId));
            const pedidosSnapshot = await getDocs(pedidosQuery);
            const pedidos = [];
            pedidosSnapshot.forEach(doc => pedidos.push(doc.data()));
            
            const totalPedidos = pedidos.length;
            const pedidosPendentes = pedidos.filter(p => p.status === 'pendente').length;
            const pedidosAceitos = pedidos.filter(p => p.status === 'aceito').length;
            const pedidosConcluidos = pedidos.filter(p => p.status === 'concluido').length;
            const pedidosRecusados = pedidos.filter(p => p.status === 'recusado').length;
            
            const receitaTotal = pedidos
                .filter(p => p.status === 'concluido')
                .reduce((sum, p) => sum + (p.valorEstimado || 0), 0);
            
            document.getElementById('dashboardTotalPedidos').textContent = totalPedidos;
            document.getElementById('dashboardPendentes').textContent = pedidosPendentes;
            document.getElementById('dashboardReceita').innerHTML = `R$ ${receitaTotal.toFixed(2)}`;
            document.getElementById('dashboardAvaliacao').innerHTML = `${document.getElementById('avaliacao').textContent}`;
            
            // Gráfico de Status - Responsivo
            const ctxStatus = document.getElementById('graficoStatus')?.getContext('2d');
            if (ctxStatus) {
                if (graficoStatus) graficoStatus.destroy();
                graficoStatus = new Chart(ctxStatus, {
                    type: 'doughnut',
                    data: {
                        labels: ['Pendentes', 'Aceitos', 'Concluídos', 'Recusados'],
                        datasets: [{
                            data: [pedidosPendentes, pedidosAceitos, pedidosConcluidos, pedidosRecusados],
                            backgroundColor: ['#f59e0b', '#3b82f6', '#10b981', '#ef4444'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        aspectRatio: 1.2,
                        plugins: {
                            legend: { 
                                position: 'bottom',
                                labels: { boxWidth: 12, font: { size: 11 } }
                            },
                            tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw} pedido(s)` } }
                        }
                    }
                });
            }
            
            // Gráfico de Receita - Responsivo
            const receitaPorMes = {};
            pedidos.filter(p => p.status === 'concluido').forEach(p => {
                if (p.criadoEm) {
                    const data = p.criadoEm.toDate();
                    const mes = `${data.getMonth() + 1}/${data.getFullYear()}`;
                    receitaPorMes[mes] = (receitaPorMes[mes] || 0) + (p.valorEstimado || 0);
                }
            });
            
            const meses = Object.keys(receitaPorMes).sort();
            const valores = meses.map(m => receitaPorMes[m]);
            
            const ctxReceita = document.getElementById('graficoReceita')?.getContext('2d');
            if (ctxReceita) {
                if (graficoReceita) graficoReceita.destroy();
                graficoReceita = new Chart(ctxReceita, {
                    type: 'line',
                    data: {
                        labels: meses,
                        datasets: [{
                            label: 'Receita (R$)',
                            data: valores,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        aspectRatio: 1.5,
                        plugins: { 
                            legend: { position: 'top', labels: { font: { size: 11 } } },
                            tooltip: { callbacks: { label: (ctx) => `R$ ${ctx.raw.toFixed(2)}` } }
                        },
                        scales: {
                            y: { ticks: { callback: (value) => `R$ ${value}`, font: { size: 10 } } },
                            x: { ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 45 } }
                        }
                    }
                });
            }
        }
        
        // Redimensionar gráficos ao mudar orientação
        window.addEventListener('resize', () => {
            if (graficoStatus) graficoStatus.resize();
            if (graficoReceita) graficoReceita.resize();
        });
        
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                if (graficoStatus) graficoStatus.resize();
                if (graficoReceita) graficoReceita.resize();
            }, 100);
        });
        
        carregarPerfilPrestador();
        
        document.getElementById('logoutBtn').addEventListener('click', () => {
            fazerLogout();
        });
        
        document.getElementById('editarPerfilBtn').addEventListener('click', () => {
            window.location.href = 'editar-prestador.html';
        });
    </script>
</body>
</html>
